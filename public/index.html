<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vid View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <div class="bg-shape bg-shape-left"></div>
    <div class="bg-shape bg-shape-right"></div>

    <header class="app-header">
        <div class="app-header-top">
            <button id="toggle-sidebar-btn" class="ghost-btn sidebar-toggle-btn" type="button"
                aria-controls="folder-sidebar" aria-expanded="true">☰ Folders</button>
            <h1>Vid View</h1>
        </div>
        <p id="base-folder-label">Loading base folder...</p>
    </header>

    <main class="layout">
        <aside class="sidebar card" id="folder-sidebar">
            <div class="section-title-row">
                <h2>Folders</h2>
                <button id="refresh-folders-btn" class="ghost-btn" type="button">Refresh</button>
            </div>
            <div id="folder-tree" class="folder-tree"></div>
        </aside>

        <section class="viewer card">
            <div class="viewer-header">
                <div>
                    <h2 id="viewer-folder-title">Select a folder</h2>
                    <p id="viewer-subtitle">Pick a folder that has videos.</p>
                </div>
                <div class="viewer-counter" id="viewer-counter">0 / 0</div>
            </div>

            <div class="video-stage">
                <video id="video-player" controls preload="metadata"></video>
                <div id="empty-state" class="empty-state">
                    Choose a folder from the left to build a video carousel.
                </div>
            </div>

            <div class="start-point-row">
                <label for="start-video-select">Start from</label>
                <select id="start-video-select" aria-label="Choose a starting video"></select>
                <button type="button" id="apply-start-btn" class="ghost-btn">Apply</button>
            </div>

            <div class="controls">
                <button type="button" id="prev-btn">Previous</button>
                <button type="button" id="next-btn">Next</button>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
