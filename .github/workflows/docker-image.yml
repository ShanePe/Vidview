name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: vidview

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  redeploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer redeploy webhook
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PORTAINER_WEBHOOK" ]]; then
            echo "PORTAINER_WEBHOOK is not configured"
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$PORTAINER_WEBHOOK")

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Portainer redeploy failed with HTTP $status"
            exit 1
          fi

          echo "Portainer redeploy triggered (HTTP $status)"
