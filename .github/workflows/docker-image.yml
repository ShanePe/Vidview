name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: vidview
  CONTAINER_NAME: vidview

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $version [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  redeploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer redeploy webhook
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PORTAINER_WEBHOOK" ]]; then
            echo "PORTAINER_WEBHOOK is not configured"
            exit 1
          fi

          image="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          payload=$(jq -n \
            --arg image "$image" \
            --arg container "$CONTAINER_NAME" \
            '{image: $image, metadata: {ctn_names: $container}}')

          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$PORTAINER_WEBHOOK")

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Portainer redeploy failed with HTTP $status"
            exit 1
          fi

          echo "Portainer redeploy triggered (HTTP $status)"
